<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Bot 管理面板 — 登录</title>
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
        }
        .login-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.45);
        }
        .login-box h2 {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .login-box h2 .logo-icon {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }
        .login-box .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 28px;
        }
        .login-box .form-group {
            margin-bottom: 18px;
        }
        .login-box label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .login-box input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-family: inherit;
            transition: border-color var(--transition);
        }
        .login-box input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79,195,247,0.15);
        }
        .login-box .btn-login {
            width: 100%;
            padding: 11px;
            margin-top: 8px;
            background: var(--accent);
            color: #111;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background var(--transition);
        }
        .login-box .btn-login:hover {
            background: var(--accent-hover);
        }
        .login-box .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .login-error {
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            background: var(--danger-bg);
            color: var(--danger);
            font-size: 0.82rem;
            text-align: center;
            display: none;
        }
        .login-error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <h2><img src="/images/logo.svg" alt="MC Bot" class="logo-icon"> MC Bot 管理面板</h2>
            <div class="subtitle">请输入用户名和密码登录</div>
            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">登 录</button>
            </form>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <script>
    (function() {
        // 如果已有 token，先验证是否有效
        const savedToken = localStorage.getItem('mc_bot_token');
        if (savedToken) {
            fetch('/api/auth/status', {
                headers: { 'Authorization': 'Bearer ' + savedToken }
            })
            .then(r => r.json())
            .then(data => {
                if (data.authenticated) {
                    window.location.replace('/');
                }
            })
            .catch(() => {});
        }

        const form = document.getElementById('loginForm');
        const errorEl = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                showError('请输入用户名和密码');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';
            errorEl.classList.remove('show');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.setItem('mc_bot_token', data.token);
                    window.location.replace('/');
                } else {
                    showError(data.error || '登录失败，请重试');
                }
            } catch (err) {
                showError('网络错误，无法连接到服务器');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '登 录';
            }
        });

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.classList.add('show');
        }
    })();
    </script>
</body>
</html>
